[www]
; run as www-data user
user  = nobody
group = nobody

; listen on all interfaces port 9000
; so NGINX can connect from another container
listen = 0.0.0.0:9000

; allow any IP to connect
;listen.allowed_clients = any

; worker processes
pm                   = dynamic
pm.max_children      = 5
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; log to stderr so docker logs shows them
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors]  = on
